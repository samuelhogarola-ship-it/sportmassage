worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    # The outer TLS proxy must replace X-Real-IP. Keep only a syntactically
    # valid single IP candidate; Node performs the authoritative IP check.
    map $http_x_real_ip $blogger_client_ip {
        default $remote_addr;
        "~^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$" $http_x_real_ip;
        "~^(?=.{2,45}$)(?=.*:)[0-9A-Fa-f:]+$" $http_x_real_ip;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html/current;
        client_max_body_size 14m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 910s;
        proxy_send_timeout 910s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $blogger_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        location = /admin/blogger {
            return 308 /admin/blogger/;
        }

        location = /admin/blogger/login {
            proxy_pass http://blogger:8787;
            add_header Cache-Control "no-store" always;
        }

        location = /admin/blogger/launch {
            proxy_pass http://blogger:8787;
            add_header Cache-Control "no-store" always;
        }

        location /admin/blogger/ {
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data: blob:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ =404;
        }

        location ~ ^/(api/admin|api/blogger|api/posts|api/build|\.well-known/wf-blogger\.json) {
            proxy_pass http://blogger:8787;
        }

        location / {
            try_files $uri $uri/ $uri/index.html =404;
        }
    }
}
